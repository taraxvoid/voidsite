[tools]
# Package manager. `packageManager` in package.json pins the exact version
# (aube re-execs it); this only bootstraps aube, so keep the two in step.
# Node comes from devEngines.runtime (aube resolves it, mise downloads it).
aube = "2.7.0"
# Used by the pre-commit hook (scripts/lint-actions.sh). actionlint matches
# the version CI downloads; shellcheck is what actionlint runs on `run:` steps.
actionlint = "1.7.12"
shellcheck = "0.11.0"
