# Shared hooks live in voidflow (pre-commit, commit-msg hint, pre-push). The
# package manager is detected from package.json's `packageManager` (aube).
# Pin to a release tag; Renovate bumps it. This file can add commands but not
# override the shared ones; differences go through package.json scripts.
remotes:
  - git_url: https://github.com/taraxvoid/voidflow
    ref: v1.0.0-next.1
    configs:
      - lefthook/base.yml

pre-commit:
  commands:
    # The shared licenses step only watches package.json and lockfiles; the
    # reviewed exception lives in the check script, so rerun when it changes.
    licenses-script:
      priority: 3
      glob: "scripts/check-licenses.ts"
      run: aube run check:licenses
