name: Setup
description: Install pnpm, Node and dependencies (repo must already be checked out)

runs:
  using: composite
  steps:
    # No version inputs: pnpm/setup reads pnpm from `packageManager` and Node
    # from `devEngines.runtime` in package.json, then runs `pnpm install`, so
    # CI can't drift from local development.
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        require-lockfile: true
