name: Setup
description: Install pnpm, Node and dependencies (repo must already be checked out)

runs:
  using: composite
  steps:
    # No version input: pnpm/action-setup reads `packageManager` from
    # package.json, and setup-node reads the Node version from its `volta`
    # block, so CI can't drift from local development.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
