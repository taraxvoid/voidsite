name: CI

# Validate every change; deploy main to production and each PR to its own
# Worker Preview (isolated D1/R2/KV, see the `previews` block in wrangler.jsonc).
#
# Validation is voidflow's site-ci.yml (aube support landed in 1.0.0-next), so
# the secrets scan, workflow lint (jactionlint + zizmor), lint, check, unit,
# license and e2e steps are maintained there. Only the Cloudflare preview and
# deploy jobs live here. main deploys to prod and PRs get previews; there are
# no other environment branches.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# No top-level concurrency: site-ci.yml declares the same group name
# (ci-<workflow>-<ref>), and a caller and callee sharing one group cancel each
# other, so validate never starts. Preview and deploy set their own below.

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@48b7f088d8baf831fb8cdd886f6721542ea79426 # v1.0.0-next.1
    with:
      package-manager: aube
      # The e2e scripts build for themselves (with a fake Google tag id).
      build: false
      # test:e2e builds with a fake Google tag id and runs the suite; the
      # others cover a Tag-Manager-only build and the signed-in editor, which
      # runs last because it wipes the local D1 and patches the built config.
      e2e-scripts: '["test:e2e", "test:e2e:gtm", "test:e2e:editor"]'

  preview:
    name: Preview
    needs: validate
    # Forks don't get repository secrets, so they can't deploy. The template
    # repo itself has nothing to deploy either.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.is_template
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: aube run build
        env:
          GIT_SHA: ${{ github.sha }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}

      # `wrangler preview` (open beta) reads the previews block (separate
      # D1/R2/KV), so a PR can't touch production content, and names the
      # Preview after the branch. The build leaves a redirect at
      # .wrangler/deploy/config.json, so no --config is needed.
      - name: Deploy Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ENCRYPTION_KEY: ${{ secrets.PREVIEW_EMDASH_ENCRYPTION_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          secrets_file="$RUNNER_TEMP/preview-secrets.env"
          (umask 077; printf 'EMDASH_ENCRYPTION_KEY=%s\n' "$PREVIEW_ENCRYPTION_KEY" > "$secrets_file")
          aube exec wrangler preview --json \
            --message "PR #$PR_NUMBER" --secrets-file "$secrets_file" \
            | tee "$RUNNER_TEMP/preview.json"
          rm -f "$secrets_file"
          # The JSON shape isn't documented yet: take the first https URL.
          url=$(jq -r '[.. | strings | select(test("^https://"))] | first // empty' "$RUNNER_TEMP/preview.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --create-if-none --edit-last \
            --body "Preview: $PREVIEW_URL (isolated D1/R2/KV, not production)"

      # Same smoke tests as production; consent specs skip themselves.
      - name: Install Playwright
        if: steps.preview.outputs.url != ''
        run: aube exec playwright install --with-deps chromium

      - name: Smoke tests
        if: steps.preview.outputs.url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: aube exec playwright test test/e2e/site.spec.ts test/e2e/legal.spec.ts test/e2e/a11y.spec.ts

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: validate
    # Skipped on the template repo itself (it can never pass the placeholder
    # check) and until Cloudflare is configured (variable
    # CLOUDFLARE_ACCOUNT_ID), so a fresh copy isn't red on day one.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !github.event.repository.is_template
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Production must not ship the template's example.com / "your
      # jurisdiction" text or the placeholder preview D1 id.
      - name: Check template placeholders are replaced
        run: aube run check:placeholders

      - name: Build
        run: aube run build
        env:
          GIT_SHA: ${{ github.sha }}
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}

      - name: Deploy
        id: deploy
        uses: taraxvoid/voidflow/actions/cloudflare-deploy@48b7f088d8baf831fb8cdd886f6721542ea79426 # v1.0.0-next.1
        with:
          env: prod
          command: deploy
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Playwright
        run: aube exec playwright install --with-deps chromium

      # Smoke-test the live site (the consent specs skip themselves: they need
      # a build with a Google tag id in the test process).
      - name: Smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: aube exec playwright test test/e2e/site.spec.ts test/e2e/legal.spec.ts test/e2e/a11y.spec.ts

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
