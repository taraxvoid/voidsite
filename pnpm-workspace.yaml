# Read by aube (the file keeps pnpm's name; aube honours the same keys).
# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
  - undici@7.29.1
blockExoticSubdeps: true
overrides:
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=7.1.0 <7.29.1: ^7.29.1
  undici@>=7.11.0 <7.29.1: ^7.29.1
  undici@>=7.15.0 <7.29.1: ^7.29.1
  undici@>=7.24.1 <7.29.1: ^7.29.1
  undici@>=7.28.0 <7.29.1: ^7.29.1
  http-cache-semantics@<=4.2.0: ^4.2.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  sharp@<0.35.5: ^0.35.5
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': ^1.31.0
